name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm run lint

      # `pnpm test` builds the worker bundle first, then asserts the rendered
      # HTML and the source-level product contract (tests/rendered-html.test.mjs).
      - name: build + product-contract tests
        run: pnpm test
