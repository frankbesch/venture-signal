<svg viewBox="0 0 360 705" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Six stages, evidence first</title>
<desc>The README&#x27;s staged evidence system, each stage with the method step in app/lib.ts that carries it. Generate alternatives: 02 Opportunity set, Generate customer × job × application combinations before choosing. State causal logic: 03 Theory of value, State what changed and why a buyer will switch, pay and stay. Investigate behavior: 04 Buying-system discovery, Reconstruct actual episodes across user, buyer, blocker and budget. Test commitments: 08 Behavioral demand, Escalate from opinion to deposits, payment, use and retention. Model economics: 09 Feasibility + economics, Prototype the bottleneck; model contribution, capacity and cash. Stage investment: 10 Decision gate, Fund only the next uncertainty-reducing milestone. Attractiveness and evidence strength stay separate: a high score with weak evidence stays visibly weak. The app computes no probability of success.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="705" rx="6" fill="#0E1C2B"/>
<text x="16" y="30" font-size="15" fill="#E8E2D6" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Six stages, evidence first</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#2D4152"/>
<rect x="16" y="56" width="328" height="70" rx="5" fill="#1F3142" stroke="#A8A296" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Generate alternatives</text>
<text x="180" y="97" font-size="12" fill="#A8A296" text-anchor="middle">02 Opportunity set: Generate customer × job</text>
<text x="180" y="113" font-size="12" fill="#A8A296" text-anchor="middle">× application combinations before choosing.</text>
<path d="M180 128 L180 146" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,138 185,138 180,146" fill="#A8A296"/>
<rect x="16" y="150" width="328" height="70" rx="5" fill="#1F3142" stroke="#17A1C8" stroke-width="1.5"/>
<text x="180" y="173" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">State causal logic</text>
<text x="180" y="191" font-size="12" fill="#A8A296" text-anchor="middle">03 Theory of value: State what changed and</text>
<text x="180" y="207" font-size="12" fill="#A8A296" text-anchor="middle">why a buyer will switch, pay and stay.</text>
<path d="M180 222 L180 240" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,232 185,232 180,240" fill="#A8A296"/>
<rect x="16" y="244" width="328" height="86" rx="5" fill="#1F3142" stroke="#17A1C8" stroke-width="1.5"/>
<text x="180" y="267" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Investigate behavior</text>
<text x="180" y="285" font-size="12" fill="#A8A296" text-anchor="middle">04 Buying-system discovery: Reconstruct</text>
<text x="180" y="301" font-size="12" fill="#A8A296" text-anchor="middle">actual episodes across user, buyer, blocker</text>
<text x="180" y="317" font-size="12" fill="#A8A296" text-anchor="middle">and budget.</text>
<path d="M180 332 L180 350" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,342 185,342 180,350" fill="#A8A296"/>
<rect x="16" y="354" width="328" height="70" rx="5" fill="#1F3142" stroke="#6DA361" stroke-width="1.5"/>
<text x="180" y="377" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Test commitments</text>
<text x="180" y="395" font-size="12" fill="#A8A296" text-anchor="middle">08 Behavioral demand: Escalate from opinion</text>
<text x="180" y="411" font-size="12" fill="#A8A296" text-anchor="middle">to deposits, payment, use and retention.</text>
<path d="M180 426 L180 444" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,436 185,436 180,444" fill="#A8A296"/>
<rect x="16" y="448" width="328" height="86" rx="5" fill="#1F3142" stroke="#559ACA" stroke-width="1.5"/>
<text x="180" y="471" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Model economics</text>
<text x="180" y="489" font-size="12" fill="#A8A296" text-anchor="middle">09 Feasibility + economics: Prototype the</text>
<text x="180" y="505" font-size="12" fill="#A8A296" text-anchor="middle">bottleneck; model contribution, capacity</text>
<text x="180" y="521" font-size="12" fill="#A8A296" text-anchor="middle">and cash.</text>
<path d="M180 536 L180 554" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="175,546 185,546 180,554" fill="#A8A296"/>
<rect x="16" y="558" width="328" height="70" rx="5" fill="#1F3142" stroke="#D17276" stroke-width="1.5"/>
<text x="180" y="581" font-size="12.5" fill="#E8E2D6" text-anchor="middle" font-weight="600">Stage investment</text>
<text x="180" y="599" font-size="12" fill="#A8A296" text-anchor="middle">10 Decision gate: Fund only the next</text>
<text x="180" y="615" font-size="12" fill="#A8A296" text-anchor="middle">uncertainty-reducing milestone.</text>
<text x="16" y="654" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Attractiveness and evidence strength stay separate: a high</text>
<text x="16" y="671" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>score with weak evidence stays visibly weak. The app</text>
<text x="16" y="688" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>computes no probability of success.</text>
</svg>
